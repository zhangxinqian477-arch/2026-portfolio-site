<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>张新倩 - 产品设计作品集</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #333333; font-family: sans-serif; }
        .loader-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #ffffff; z-index: 10; color: #666; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #333; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        iframe { width: 100%; height: 100%; border: none; position: relative; z-index: 1; }
    </style>
</head>
<body>
    <div class="loader-container" id="loader">
        <div class="spinner"></div>
        <div>作品集加载中，请稍候...</div>
    </div>
    
    <!-- 这里的 %20 代表的就是原文件名里的空格 -->
    <iframe 
        src="Zhang%20Xinqian%20portfolio.pdf#toolbar=0&navpanes=0" 
        title="张新倩产品设计作品集" 
        onload="document.getElementById('loader').style.display='none'">
        
        您的浏览器不支持直接预览 PDF。请<a href="Zhang%20Xinqian%20portfolio.pdf" target="_blank">点击此处下载</a>查看。
    </iframe>
</body>
</html>
