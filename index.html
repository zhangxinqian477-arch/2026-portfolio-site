  <style>

    iframe { display: block; width: 100%; height: 100%; border: 0; }

    .spinner { width: 32px; height: 32px; margin: auto; border: 3px solid #56565b; border-top-color: #eee; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
  <script src="portfolio-viewer.js?v=2" defer></script>

    <a href="Zhang%20Xinqian%20portfolio.pdf?v=1646a52ed7cc" target="_blank" rel="noopener">直接打开 PDF</a>
  </div>
  <iframe id="portfolio" title="张新倩作品集，带页面缩略图导航" allow="fullscreen"></iframe>
