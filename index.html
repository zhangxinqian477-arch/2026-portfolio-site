<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>张新倩 - 产品设计作品集</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #f5f5f5; font-family: sans-serif; }
        
        /* 页面加载遮罩层的样式 */
        .loader-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background-color: #ffffff; z-index: 10; color: #666;
        }
        
        /* 旋转圈圈的样式 */
        .spinner {
            width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #333;
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        iframe { width: 100%; height: 100%; border: none; position: relative; z-index: 1; }
    </style>
</head>
<body>
    <!-- 这里的 div 就是加载画面 -->
    <div class="loader-container" id="loader">
        <div class="spinner"></div>
        <div>作品集加载中，请稍候...</div>
    </div>

    <!-- 当 PDF 加载完毕 (onload) 时，自动隐藏上面的加载画面 -->
    <iframe src="portfolio.pdf" title="张新倩作品集" onload="document.getElementById('loader').style.display='none'">
        您的浏览器不支持直接预览 PDF。请<a href="portfolio.pdf" target="_blank">点击此处下载</a>查看。
    </iframe>
</body>
</html>
